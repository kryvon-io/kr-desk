[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/kryvon-io/kr-desk"

[workspace.dependencies]
kr-proto = { path = "crates/kr-proto" }
kr-core = { path = "crates/kr-core" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
