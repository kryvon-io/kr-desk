[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/kryvon-io/kr-desk"

[workspace.dependencies]
kr-proto = { path = "crates/kr-proto" }
kr-core = { path = "crates/kr-core" }
kr-identity = { path = "crates/kr-identity" }
kr-signaling = { path = "crates/kr-signaling" }
kr-transport = { path = "crates/kr-transport" }
kr-codec-soft = { path = "crates/kr-codec-soft" }
kr-capture-win = { path = "crates/kr-capture-win" }
kr-codec-win = { path = "crates/kr-codec-win" }
kr-input-win = { path = "crates/kr-input-win" }
kr-service-win = { path = "crates/kr-service-win" }
kr-host = { path = "crates/kr-host" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
argon2 = "0.6"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
sha2 = { version = "0.11.1", default-features = false }
getrandom = "0.4.3"
zeroize = "1.9.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Provedor de criptografia do rustls: `ring` compila no Windows MSVC sem cmake/nasm.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }
tracing = "0.1.44"
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
# Tipos de mídia/RTP que o `webrtc` não reexporta (mesma versão que ele usa).
rtc = { version = "0.21.1", default-features = false }
# Só para testes (kr-codec-soft); o app usa Media Foundation.
openh264 = "0.9.9"
async-trait = "0.1.89"
bytes = "1.12.0"
uuid = { version = "1.29.2", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-build = { version = "2.7.4", features = [] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# "unwind": um pânico numa task não derruba o app inteiro (com "abort", o app
# fechava sem aviso).
panic = "unwind"
