name: Release (Windows)

# Só roda quando VOCÊ publica uma release na tela "Releases" do GitHub (com uma
# tag v<versão>). Nunca roda a partir de pull requests. Os arquivos (instalador,
# pacote assinado e latest.json) são anexados a essa mesma release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Instalador NSIS + atualização automática → GitHub Release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    permissions:
      contents: write # necessário para criar o Release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Conferir a versão (tag = versão do app)
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          app="v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$app" != "$TAG" ]; then
            echo "::error::A tag $TAG não bate com a versão do app ($app)."
            exit 1
          fi
      # Gera também o pacote assinado e o latest.json da atualização automática.
      # O app só instala atualizações assinadas com esta chave (a pública está
      # em tauri.conf.json).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          # Anexa à release que você publicou (sem criar outra).
          releaseId: ${{ github.event.release.id }}
