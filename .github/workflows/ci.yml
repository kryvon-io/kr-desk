name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Token somente leitura por padrão. PRs de forks nunca recebem segredos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  js:
    name: JS — formato, lint, tipos, testes, build
    runs-on: ubuntu-latest
    # Postgres e Redis reais para os testes de integração do servidor.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/krdesk_test
      TEST_REDIS_URL: redis://localhost:6379/1
      PRISMA_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verificar migrações e aplicar no banco de teste
        working-directory: apps/server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm exec prisma migration check
          pnpm exec prisma db migrate --yes --no-interactive
      - run: pnpm test
      - run: pnpm --filter @kr-desk/desktop build

  rust-core:
    name: Rust — crates multiplataforma (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy -p kr-proto -p kr-core -p kr-identity -p kr-signaling --all-targets -- -D warnings
      # O servidor TypeScript (em memória) valida o cliente Rust de ponta a ponta.
      - name: Subir servidor de sinalização local
        run: |
          PORT=3100 WS_MAX_LIFETIME_MS=3000 pnpm --filter @kr-desk/server start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Testes (inclui cliente Rust x servidor real)
        env:
          KR_SIGNALING_URL: ws://127.0.0.1:3100/ws
        run: cargo test -p kr-proto -p kr-core -p kr-identity -p kr-signaling -- --include-ignored

  windows:
    name: Windows — clippy, testes e instalador NSIS
    runs-on: windows-latest
    needs: [js, rust-core]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # O Tauri embute o frontend na compilação, então ele precisa existir antes do clippy.
      - run: pnpm --filter @kr-desk/desktop build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Gerar instalador (não assinado)
        run: pnpm --filter @kr-desk/desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: kr-desk-windows-x64-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
